# Free headless DAILY EARTH REPORT renderer (EMSC • UTC)
# Uses the exact drawDailyFrame() from src/components/DailyEarthReport.tsx
# (same pipeline as quake-video but for the longitude-scanned global map).
# Costs $0 (GitHub-hosted runners: 2000 min/month free).
#
# Trigger: daily cron at 00:05 UTC, or manually with optional DAILY_JSON.
# Output: OUT_DIR/out.mp4 (20s, 1080x1440), optional FB + Telegram upload.

name: daily-earth-report

on:
  workflow_dispatch: # Cloudflare Worker triggers at 00:05 UTC sharp (accurate) + manual
  # schedule kept as fallback but disabled for accuracy (Cloudflare is precise):
  # schedule:
  #   - cron: '5 0 * * *'
    inputs:
      daily_json:
        description: 'Optional JSON array of EMSC events (overrides live fetch)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure FFmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Bundle daily renderer
        run: npx esbuild scripts/daily-video-entry.ts --bundle --platform=node --format=esm --external:canvas --loader:.css=empty --outfile=dist-video/daily-entry.mjs
      - name: Render + encode + upload
        env:
          DAILY_JSON: ${{ inputs.daily_json }}
          OUT_DIR: video-out
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_UPLOAD_TOKEN: ${{ secrets.FB_UPLOAD_TOKEN }}
          FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          mkdir -p video-out
          node dist-video/daily-entry.mjs
          cat video-out/caption.txt 2>/dev/null || true

      - name: Reformat for TikTok (9:16)
        if: always()
        run: if [ -f video-out/out.mp4 ]; then ffmpeg -y -i video-out/out.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" -c:a copy video-out/tiktok.mp4 || echo "tiktok reformat skipped"; else echo "tiktok reformat skipped (no out.mp4)"; fi

      - name: Telegram send
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Telegram skipped"; exit 0; fi
          if [ ! -f "video-out/out.mp4" ]; then echo "no mp4"; exit 0; fi
          CAPTION=$(cat video-out/caption.txt 2>/dev/null | cut -c1-1000 || echo "Terra Guard PH Daily Earth Report")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" -F chat_id="${TELEGRAM_CHAT_ID}" -F video="@video-out/out.mp4" -F caption="$CAPTION" | head -c 500; echo ""

      - name: Keep MP4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-earth-report
          path: video-out/out.mp4
          retention-days: 7
