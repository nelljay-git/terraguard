name = "terraguard-monitor"
main = "src/terraguard.js"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

# ONE cron set for all four monitors (weather + volcano + haze + tsunami).
# Push notifications piggyback on the 1-minute tick for near-live alerts.
# Daily summaries: 07:00/18:00 PHT (23:00/10:00 UTC).
[triggers]
crons = ["* * * * *", "0 23 * * *", "0 10 * * *"]

# Bind ALL existing namespaces to keep history (no re-baseline burst),
# or bind a single TERRAGUARD_KV to start fresh (one baseline burst).
[[kv_namespaces]]
binding = "PAGASA_KV"
id = "REPLACE_WITH_PAGASA_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

[[kv_namespaces]]
binding = "VOLCANO_KV"
id = "REPLACE_WITH_VOLCANO_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

[[kv_namespaces]]
binding = "HAZE_KV"
id = "REPLACE_WITH_HAZE_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

[[kv_namespaces]]
binding = "TSUNAMI_KV"
id = "REPLACE_WITH_TSUNAMI_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

[[kv_namespaces]]
binding = "TERRAGUARD_KV"
id = "REPLACE_WITH_TERRAGUARD_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

[vars]
SIGNIFICANT_AREA_DELTA = "1"
MAX_EVENTS_INDEX = "100"
# "0" disables satellite images per monitor (on by default):
# PAGASA_SATELLITE = "0"
# VOLCANO_SATELLITE = "0"
# HAZE_SATELLITE = "0"
# "1" = volcano daily-brief mode (routine same-level bulletins also notify)
# VOLCANO_DAILY_BRIEF = "1"

# Secrets (set via `wrangler secret put --config wrangler-terraguard.toml`):
# DISCORD_WEBHOOK_URL = weather + haze + fallback for all
# VOLCANO_DISCORD_WEBHOOK_URL = volcano's OWN channel (falls back to default)
# HAZE_DISCORD_WEBHOOK_URL = haze channel (falls back to default)
# TSUNAMI_WEBHOOK_URL = tsunami channel (falls back to default, or WEBHOOK_KV legacy)
# CRON_SECRET = master secret for /trigger + all API reads
# PAGASA_API_SECRET / VOLCANO_API_SECRET / HAZE_API_SECRET / TSUNAMI_API_SECRET = optional per-monitor read secrets
# TSUNAMI_MIN_SEVERITY = "" (all), "advisory", or "warning" (filters Discord)
