name = "terraguard-earthquake"
main = "src/earthquake.js"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

# Fast-moving feeds + 1/2/5/10m video intensity retries — every minute.
[triggers]
crons = ["* * * * *"]

# Reuse the SAME namespace the old workers used (terraguard-push) —
# KV keys are unchanged, so dedup history carries over, no resend burst.
[[kv_namespaces]]
binding = "WEBHOOK_KV"
id = "REPLACE_WITH_EXISTING_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

[vars]
MIN_MAGNITUDE = "4.5"
USGS_MIN_LAT = "-90"
USGS_MAX_LAT = "90"
USGS_MIN_LNG = "-180"
USGS_MAX_LNG = "180"
USGS_FEED = "all_day.geojson"
EMSC_MIN_MAG = "1.0"
EMSC_MIN_LAT = "-90"
EMSC_MAX_LAT = "90"
EMSC_MIN_LNG = "-180"
EMSC_MAX_LNG = "180"

# Secrets:
# DISCORD_WEBHOOK_URL = USGS channel (existing)
# EMSC_WEBHOOK_URL = EMSC's OWN channel (existing; falls back to DISCORD_WEBHOOK_URL)
# BOT_TOKEN = optional (auto-reactions), FELT_REPORTS_WEBHOOK_URL = optional (EMSC poll)
# CRON_SECRET = manual trigger secret
# Facebook auto-post (EMSC + PHIVOLCS + USGS final — see per-source rules):
# FB_PAGE_ID, FB_USER_ACCESS_TOKEN (long-lived user token, or Page token),
# FB_APP_ID, FB_APP_SECRET (used for appsecret_proof). If FB_PAGE_ID or
# FB_USER_ACCESS_TOKEN is missing, FB is skipped silently.
# FB_MAG_MIN = min magnitude to post to FB (Discord unaffected).
# FB_COUNTRY_FOCUS = comma-separated substring match on EMSC location
#   (e.g. "PHILIPPINES"). Empty or "ALL" = post worldwide.
# NOTE: EMSC never FB-posts Philippines events (matches "PHILIPP") —
#   PHIVOLCS owns them. Applies even with FB_COUNTRY_FOCUS=ALL.
# PHIVOLCS → Facebook only (never Discord):
# PHIVOLCS_API_URL (default https://trikefare.x10.mx/terraguard/phivolcs.php),
# PHIVOLCS_API_URL_BACKUP (default http://nell-systems.x10.mx/terraguard/phivolcs.php),
# PHIVOLCS_MIN_MAG (default "3.0"). Same FB_MAG_MIN / FB_COUNTRY_FOCUS gates
# apply. Skips quakes EMSC/PHIVOLCS already FB-posted (USGS finals don't
# suppress it — confirmation pattern).
# USGS → Facebook: video close at/above RENDER_MIN_MAG (default "5.5"),
# silence below it. Same FB_MAG_MIN / FB_COUNTRY_FOCUS gates, no PH
# exception. USGS_POST_FB=false (also 0/no/off) disables USGS FB entirely.
# Free video renderer (GitHub Actions, $0): after a USGS final report
# at/above RENDER_MIN_MAG (default "5.0"), the worker fires a
# repository_dispatch to build + upload the video report. EMSC/PHIVOLCS
# FB posts do NOT trigger videos.
# GH_DISPATCH_TOKEN = classic PAT with `repo` scope (GITHUB_TOKEN cannot
# trigger dispatches). GH_REPO default "nelljay-git/terraguard".
