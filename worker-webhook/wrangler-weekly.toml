name = "terraguard-weekly-emsc"
main = "src/weekly-emsc.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 0 * * 1"] # Mondays 00:00 UTC

[[kv_namespaces]]
binding = "WEBHOOK_KV"
id = "REPLACE_WITH_SAME_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

[vars]
EMSC_MIN_MAG = "1.0" # weekly global M1.0

# Secrets (set via `wrangler secret put` on this worker):
# WEEKLY_ANALYTICS_WEBHOOK_URL = "https://discord.com/api/webhooks/..."
# CRON_SECRET = "same secret"
# BOT_TOKEN = "optional"
